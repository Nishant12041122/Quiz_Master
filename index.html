<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>QuizMaster - Login</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet" href="style2.css">
</head>

<body>

<div class="container-fluid min-vh-100 d-flex align-items-center justify-content-center">

    <div class="card shadow-lg border-0 p-4 login-card">

        <div class="text-center mb-4">
            <h1 class="fw-bold text-primary">QuizMaster</h1>
            <p class="text-muted">Online Quiz System</p>
        </div>

        <form id="loginForm">

            <div class="mb-3">
                <label class="form-label">Student Name</label>

                <input
                    type="text"
                    id="studentName"
                    class="form-control"
                    placeholder="Enter your name"
                    required>
            </div>
<div class="mb-3">
    <label class="form-label">Student Type</label>

    <div class="d-flex gap-4">

        <div class="form-check">
            <input
                type="radio"
                class="form-check-input"
                id="smeStudent"
                name="studentType"
                value="SME Student"
                required>

            <label
                class="form-check-label"
                for="smeStudent">
                SME Student
            </label>
        </div>

        <div class="form-check">
            <input
                type="radio"
                class="form-check-input"
                id="notSmeStudent"
                name="studentType"
                value="Not SME Student">

            <label
                class="form-check-label"
                for="notSmeStudent">
                Not SME Student
            </label>
        </div>

    </div>
</div>


<div class="mb-4">
    <label
        for="mobileNumber"
        class="form-label">

        Mobile Number

    </label>

    <input
        type="tel"
        id="mobileNumber"
        class="form-control"
        placeholder="Enter 10-digit mobile number"
        maxlength="10"
        inputmode="numeric"
        pattern="[0-9]{10}"
        required>
</div>


            <button
                type="submit"
                class="btn btn-primary w-100 py-2">

                Start Quiz

            </button>

        </form>

        <a href="history.html"
           class="btn btn-outline-primary w-100 mt-3">

            Quiz History

        </a>

        <p class="text-center text-muted mt-4 mb-0">
    © 2026 QuizMaster | Developed by Nishant
</p>

    </div>

</div>

<script src="login.js"></script>

</body>
</html>
